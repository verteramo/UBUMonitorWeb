<header>
  <app-navbar
    [principal]="principal()"
    (changeCourse)="changeCourse()"
    (logout)="logout()"
    (toggleSidebar)="drawer.toggle()"
  >
  </app-navbar>
</header>

<main>
  <mat-sidenav-container autosize>
    <mat-sidenav #drawer mode="side" opened>
      <div class="sidebar-component">
        <mat-accordion multi="true">
          <mat-expansion-panel expanded>
            <mat-expansion-panel-header>
              <mat-panel-title i18n>Users</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="expansion-panel-body">
              <app-users-list></app-users-list>
            </div>
          </mat-expansion-panel>

          <mat-expansion-panel>
            <mat-expansion-panel-header>
              <mat-panel-title i18n>Activity Selection</mat-panel-title>
            </mat-expansion-panel-header>
            <!-- <div class="expansion-panel-body">
      <app-activity-selection></app-activity-selection>
    </div> -->
          </mat-expansion-panel>
        </mat-accordion>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="workspace">
        <p>Workspace</p>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</main>

<footer>
  <app-statusbar [platform]="principal().platform" [course]="course()"> </app-statusbar>
</footer>
