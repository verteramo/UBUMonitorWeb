<header>
  <app-navbar
    [principal]="principal"
    (changeCourse)="changeCourse()"
    (logout)="logout()"
    (toggleSidebar)="drawer.toggle()"
  >
  </app-navbar>
</header>

<main>
  <mat-sidenav-container autosize>
    <mat-sidenav #drawer mode="side" opened>
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="workspace">
        <p>Workspace</p>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</main>

<footer>
  <app-statusbar [principal]="principal" [course]="course"> </app-statusbar>
</footer>
