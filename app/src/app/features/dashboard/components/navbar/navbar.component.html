<mat-toolbar color="primary" class="header">
  <button
    matIconButton
    (click)="toggleSidebar.emit()"
    i18n-title
    title="Open sidebar"
    class="menu-button"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <img src="logo2.png" alt="Logo" class="app-logo" />
  <span class="app-title">UBUMonitorWeb</span>

  <span class="spacer"></span>

  <!-- Menú Logs -->
  <button matButton [matMenuTriggerFor]="logsMenu" i18n>
    <mat-icon>receipt_long</mat-icon> Logs
  </button>
  <mat-menu #logsMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>upload_file</mat-icon>
      <span i18n>Upload</span>
    </button>
    <button mat-menu-item>
      <mat-icon>delete_sweep</mat-icon>
      <span i18n>Clear</span>
    </button>
  </mat-menu>

  <!-- Menú Export -->
  <button matButton [matMenuTriggerFor]="exportMenu" i18n>
    <mat-icon>download</mat-icon> Export
  </button>
  <mat-menu #exportMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>dashboard</mat-icon>
      <span i18n>Dashboard</span>
    </button>
    <button mat-menu-item>
      <mat-icon>leaderboard</mat-icon>
      <span i18n>Ranking</span>
    </button>
    <button mat-menu-item>
      <mat-icon>group</mat-icon>
      <span i18n>Users</span>
    </button>
  </mat-menu>

  <!-- Botón Settings -->
  <button matButton i18n><mat-icon>settings</mat-icon> Settings</button>

  <!-- Botón Modo Claro / Oscuro -->
   <app-theme-toggle></app-theme-toggle>

  <button matIconButton [matMenuTriggerFor]="userMenu" class="avatar-button">
    <img [src]="principal().userpictureurl" [alt]="principal()?.fullname" class="avatar" />
  </button>

  <mat-menu #userMenu>
    <div class="user-info">
      <strong>{{ principal()?.fullname }}</strong>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="changeCourse.emit()">
      <mat-icon>swap_horiz</mat-icon>
      <span i18n>Change course</span>
    </button>
    <button mat-menu-item (click)="logout.emit()">
      <mat-icon>logout</mat-icon>
      <span i18n>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
