spring:
  application:
    name: ubumonitorweb
  profiles:
    active: dev
  web:
    locale: en
    error.include-stacktrace: never
  messages:
    fallback-to-system-locale: false

openapi:
  parameters:
    Moodle-Host:
      in: header
      description: URL base del servidor Moodle de destino.
  security-schemes:
    cookieAuth:
      type: apikey
      in: cookie
      name: auth-token
      description: Cookie con token JWE.

logging:
  level:
    es.ubu.lsi.ubumonitorweb: DEBUG

security:
  filter.public-routes:
    - /api/token
    - /actuator**
    - /swagger-ui**
    - /v3/api-docs**
  strategy: cookie
  codec: jwe
  codec.jwe:
    key-size: 256
    algorithm: AES
  strategy.cookie:
    name: principal
    path: /
    http-only: true
    same-site: strict
    max-age: 86400
  strategy.header:
    scheme: Bearer
    key: principal

service:
  default:
    host-header: Moodle-Host
    send-headers:
      - Accept-Language
    headers:
      Content-Type: application/x-www-form-urlencoded

  profiles:
    auth:
      endpoint: /login/token.php
      params:
        service: moodle_mobile_app

    rest:
      endpoint: /webservice/rest/server.php
      params:
        moodlewsrestformat: json
      suppliers:
        wstoken:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.moodle.TokenParameterSupplier
        wsfunction:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.moodle.FunctionParameterSupplier
