spring:
  application:
    name: ubumonitorweb
  web:
    locale: en
  messages:
    fallback-to-system-locale: false
  profiles:
    default: dev
  mvc:
    problemdetails:
      enabled: true

# Configuración de la cookie de sesión.
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

client:
  profiles:
    # Perfil con propiedades globales.
    default-get:
      host: es.ubu.lsi.ubumonitorweb.core.client.ClientHostProvider
      forward-headers:
        - Accept-Language

    default-post:
      inherit: default-get
      headers:
        Content-Type: application/x-www-form-urlencoded

    # Perfil del cliente de obtención del token.
    credentials-client:
      inherit: default-post
      endpoint: /login/token.php
      params:
        service: moodle_mobile_app

    # Perfil del cliente de obtención de los datos del usuario propietario del token.
    principal-client:
      inherit: default-post
      endpoint: /webservice/rest/server.php
      params:
        moodlewsrestformat: json
        wsfunction: core_webservice_get_site_info

    # Perfil del cliente de recursos que requerirían cookies de sesión (usando token).
    resource-client:
      inherit: default-get
      endpoint: /webservice/pluginfile.php

    # Perfil de los clientes del webservice REST.
    webservice-client:
      inherit: default-post
      endpoint: /webservice/rest/server.php
      params:
        moodlewsrestformat: json
      providers:
        wstoken:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.client.ClientTokenProvider
        wsfunction:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.client.ClientFunctionProvider
