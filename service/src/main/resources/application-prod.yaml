security:
  public-routes:
    - /
    - /index.html
    - /favicon.png
    - /logo1.png
    - /_app/**
    - /api/auth/login
    - /api/auth/logout

# Actuator
management:
  endpoints:
    access:
      default: none

# SpringDoc Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
