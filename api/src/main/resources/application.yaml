spring:
  application:
    name: ubumonitorweb
  # Si no se especifica Accept-Language al utilizar
  # este backend, se asume idioma inglés para la emisión
  # de mensajes
  web:
    locale: en
    error:
      include-message: always
  messages:
    fallback-to-system-locale: false
  # Por defecto, se asume el perfil de desarrollo,
  # que en determinados casos puede habilitar un
  # logging más completo de todo lo que ocurre en
  # cada momento
  profiles:
    default: dev
  # Se utiliza la convención ProblemDetail para
  # la generación de errores de este backend,
  # esto implica que cualquier error será presentado
  # en forma de objeto ProblemDetail:
  # https://www.rfc-editor.org/rfc/rfc9457.html
  mvc:
    problemdetails:
      enabled: true
  # Configuración de la base de datos y repositorios
  # que almacenan los datos de los usuarios

  datasource:
    url: jdbc:h2:file:~/.umw/database;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  # Consola H2
#  h2:
#    console:
#      enabled: true
#      path: /h2-console

# Configuración de las cookies de sesión
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

logs:
  boolean-prefixes: [ is, has ]

clients:
  factory:
    ssl-trust-strategy: trust_all

  service-error-mappings:
    invalidlogin: unauthorized
    invalidtoken: unauthorized
    invalidresponse: service_unavailable
    nopermissions: forbidden
    apprequired: forbidden
    codingerror: bad_request
    invalid_parameter: bad_request
    sitepolicynotagreed: unavailable_for_legal_reasons
    autologinkeygenerationlockout: too_many_requests
    redirecterrordetected: internal_server_error

  scraping-error-mappings:
    not-found:
      status: forbidden
      detail-selector: .errormessage

  profiles:
    default-get:
      site-url: es.ubu.lsi.ubumonitorweb.core.provider.SiteUrlProvider
      method: GET

    default-post:
      site-url: es.ubu.lsi.ubumonitorweb.core.provider.SiteUrlProvider
      method: POST

    # Perfil del cliente de obtención del token
    login-token-client:
      inherit: default-post
      endpoint: /login/token.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      params:
        service: moodle_mobile_app

    # Perfil del cliente del formulario de login
    login-index-get-client:
      inherit: default-get
      endpoint: /login/index.php

    login-index-post-client:
      inherit: default-post
      endpoint: /login/index.php
      headers:
        Content-Type: application/x-www-form-urlencoded

    # Perfil del cliente del formulario de edición del perfil
    user-edit-client:
      inherit: default-get
      endpoint: /user/edit.php
      params:
        lang: en

    webservice-client:
      inherit: default-post
      endpoint: /webservice/rest/server.php
      headers:
        Content-Type: application/x-www-form-urlencoded
      params:
        moodlewsrestformat: json
      providers:
        wstoken:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.provider.TokenProvider
        wsfunction:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.provider.FunctionProvider

    autologin-client:
      inherit: webservice-client
      headers:
        User-Agent: MoodleMobile

    ajax-client:
      inherit: default-post
      endpoint: /lib/ajax/service.php
      multiple: true
      headers:
        Content-Type: application/json
      params:
        index: 0
      providers:
        args:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.provider.ArgsProvider
        methodname:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.provider.FunctionProvider

    # Perfil del cliente de recursos que requerirían cookies de sesión (usando token)
    resource-client:
      inherit: default-get
      endpoint: /webservice/pluginfile.php
      providers:
        token:
          location: param
          bean: es.ubu.lsi.ubumonitorweb.core.provider.TokenProvider

    # Perfil del cliente de reportes de logs
    log-client:
      inherit: default-get
      endpoint: /report/log/index.php
      params:
        logreader: logstore_standard
        download: csv
        chooselog: 1
        # Los nombres de los campos son siempre en inglés (para garantizar un mapeado correcto)
        lang: en
