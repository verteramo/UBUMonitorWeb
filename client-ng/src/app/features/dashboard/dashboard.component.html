<div class="dashboard-layout">
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>UBUMonitorWeb</span>

    <span class="spacer"></span>

    @if ($principal(); as principal) {
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <img [src]="principal.userpictureurl" [alt]="principal.fullname" class="avatar" />
      </button>

      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="user-info">
          <strong>{{ principal.fullname }}</strong>
          <div class="site-name">{{ principal.sitename }}</div>
        </div>
        <mat-divider></mat-divider>
        <a mat-menu-item [href]="principal.siteurl" target="_blank">
          <mat-icon>open_in_new</mat-icon>
          <span>Ir al sitio principal</span>
        </a>
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    }
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Inicio</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="content-area">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
