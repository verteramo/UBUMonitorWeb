name: 'Setup Environment & Gradle'
description: 'Sets up Java, Gradle, extracts version from tag, and ensures gradlew permissions'

inputs:
  distribution:
    description: 'Java distribution (temurin, graalvm, etc.)'
    required: false
    default: 'temurin'

outputs:
  version:
    description: "Clean version extracted from the tag"
    value: ${{ steps.version.outputs.VERSION }}

runs:
  using: 'composite'
  steps:
    - name: Extract Version
      id: version
      shell: bash
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.distribution }}
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable (Unix)
      if: runner.os != 'Windows'
      run: chmod +x gradlew
      shell: bash
