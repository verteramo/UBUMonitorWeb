name: Validate

on:
  workflow_call:

jobs:
  validate:
    name: Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Check code format (Ktlint)
        run: ./gradlew ktlintCheck

      - name: Run Tests
        run: ./gradlew test
