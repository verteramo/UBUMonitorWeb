name: Build Native

on:
  workflow_call:

jobs:
  build-native:
    name: Build Native (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            runner: ubuntu-latest
            # En Linux el binario suele llamarse como el artefacto o el módulo (ajusta si se llama ubumonitorweb o api)
            dir_path: api/build/native/nativeCompile
          - os: windows
            runner: windows-latest
            dir_path: api/build/native/nativeCompile
          - os: macos
            runner: macos-latest
            dir_path: api/build/native/nativeCompile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup
        with:
          distribution: 'graalvm'

      - name: Build Native Package
        run: ./gradlew nativePackage

      - name: Package Native Directory into ZIP
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${{ steps.setup.outputs.version }}"

          # Comprimimos TODO el contenido de nativeCompile (ejecutable + DLLs/librerías) directamente en el ZIP
          cd ${{ matrix.target.dir_path }}
          zip -r "../../dist/ubumonitorweb-${VERSION}-${{ matrix.target.os }}.zip" *
          cd ../../..

      - name: Upload Native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-asset-${{ matrix.target.os }}
          path: dist/*.zip
          retention-days: 1
