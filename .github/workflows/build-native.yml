name: Build Native
on:
  workflow_call:

jobs:
  build-native:
    name: Build Native (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: write # Necesario para subir a la release directamente
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            runner: ubuntu-latest
            dir_path: api/build/native/nativeCompile
          - os: windows
            runner: windows-latest
            dir_path: api/build/native/nativeCompile
          - os: macos
            runner: macos-latest
            dir_path: api/build/native/nativeCompile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup
        with:
          distribution: 'graalvm'

      - name: Build Native Package
        run: ./gradlew :api:nativePackage

      - name: Package Native Directory into ZIP
        shell: bash
        run: |
          mkdir -p dist/temp_bin
          VERSION="${{ steps.setup.outputs.version }}"
          ZIP_NAME="ubumonitorweb-${VERSION}-${{ matrix.target.os }}.zip"

          cp -r ${{ matrix.target.dir_path }}/* dist/temp_bin/
          cd dist/temp_bin

          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a -tzip "../$ZIP_NAME" *
          else
            zip -r "../$ZIP_NAME" *
          fi

          cd ..
          rm -rf temp_bin

      # NUEVO PASO: Cada runner sube su ZIP en cuanto termina
      - name: Upload Native ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
