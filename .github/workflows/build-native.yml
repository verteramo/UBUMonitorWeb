name: Build Native

on:
  workflow_call:

jobs:
  build-native:
    name: Build Native (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            runner: ubuntu-latest
            # En Linux el binario suele llamarse como el artefacto o el módulo (ajusta si se llama ubumonitorweb o api)
            dir_path: api/build/native/nativeCompile
          - os: windows
            runner: windows-latest
            dir_path: api/build/native/nativeCompile
          - os: macos
            runner: macos-latest
            dir_path: api/build/native/nativeCompile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup
        with:
          distribution: 'graalvm'

      - name: Build Native Package
        run: ./gradlew nativePackage

      - name: Package Native Directory into ZIP
        shell: bash
        run: |
          # Creación carpeta destino
          mkdir -p dist/temp_bin
          VERSION="${{ steps.setup.outputs.version }}"
          ZIP_NAME="ubumonitorweb-${VERSION}-${{ matrix.target.os }}.zip"

          # Copiado de todo el contenido (binario + librerías) a la carpeta temporal
          cp -r ${{ matrix.target.dir_path }}/* dist/temp_bin/

          # Acceso al directorio temporal y compresión
          cd dist/temp_bin
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Si es Windows, se usa 7-Zip, preinstalado en los runners de GitHub
            7z a -tzip "../$ZIP_NAME" *
          else
            # Linux y macOS utilizan zip normal
            zip -r "../$ZIP_NAME" *
          fi

          # Limpieza
          cd ..
          rm -rf temp_bin

      - name: Upload Native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-asset-${{ matrix.target.os }}
          path: dist/*.zip
          retention-days: 1
