name: Release Orchestrator

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  call-validate:
    name: 1. Validate & Test
    uses: ./.github/workflows/validate.yml

  create-release:
    needs: call-validate
    name: 2. Create Base Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate Release Title
        id: meta
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_DATE=$(date +%Y%m%d)
          echo "TITLE=v${VERSION} (Build: ${BUILD_DATE})" >> $GITHUB_OUTPUT

      - name: Create empty GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.TITLE }}
          draft: false
          prerelease: false

  call-build-war:
    needs: create-release
    name: 3. Build WAR
    uses: ./.github/workflows/build-war.yml

  call-build-native:
    needs: create-release
    name: 4. Build Native (Matrix)
    uses: ./.github/workflows/build-native.yml
