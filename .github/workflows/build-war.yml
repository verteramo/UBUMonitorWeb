name: Build WAR
on:
  workflow_call:

jobs:
  build-war:
    name: Build WAR Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup

      - name: Build Embedded WAR
        run: ./gradlew bootPackage

      - name: Rename and Prepare WAR
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${{ steps.setup.outputs.version }}"
          cp api/build/libs/*.war "dist/ubumonitorweb-${VERSION}.war"

      # NUEVO PASO: Sube directamente a la release existente
      - name: Upload WAR to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.war
