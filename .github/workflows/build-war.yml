name: Build WAR

on:
  workflow_call:

jobs:
  build-war:
    name: Build WAR Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup

      - name: Build Embedded WAR
        run: ./gradlew bootPackage

      - name: Rename and Prepare WAR
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${{ steps.setup.outputs.version }}"
          cp api/build/libs/*.war "dist/ubumonitorweb-${VERSION}.war"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-asset
          path: dist/*.war
          retention-days: 1
